# H2 Database Configuration
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:ewmDB;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate - auto create schema
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.transaction=INFO

# Stats service URL (will run on same machine)
EWM-STATS-SERVICE_URI=http://localhost:9090
stats-service.url=http://localhost:9090

# Server port
server.port=8080
